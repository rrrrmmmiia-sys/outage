name: Fetch Mazandaran Outages

on:
  schedule:
    # ⚠️ گیت‌هاب فقط UTC می‌فهمد؛ timezone زیرِ cron سینتکس نامعتبریه و نادیده گرفته میشه.
    # 21:00 UTC = 00:30 بامداد تهران — عمداً بعد از نیمه‌شب ایرانه چون سایت لیست روز
    # جدید رو همون موقع می‌ذاره. اسکریپت هم خودش تاریخ رو با Asia/Tehran حساب می‌کنه
    # (تاریخِ runner که UTC هست ملاک نیست).
    - cron: "0 21 * * *"
  workflow_dispatch: {}  # اجازه‌ی اجرای دستی از تب Actions گیت‌هاب، برای تست

jobs:
  fetch-and-store:
    runs-on: ubuntu-latest
    steps:
      - name: چک‌اوت کد ریپازیتوری
        uses: actions/checkout@v4

      - name: نصب پایتون
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: نصب وابستگی‌ها
        run: pip install psycopg2-binary

      - name: اجرای اسکریپت دریافت و ذخیره‌ی قطعی‌ها
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: python fetch_outages_postgres.py
